<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fixate Mumbai: verified repairs, item rentals and hospital/home caretakers near you.">
<style>body{margin:0}img{max-width:100%}</style>
<title>Fixate Mumbai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Single, deliberate "Mumbai poster" look: kaali-peeli taxi yellow, BEST red, Arabian Sea blue, Marine Drive sunset. */
:root{
  color-scheme:light;
  --paper:#FFFFFF; --mist:#EAF6FA; --lemon:#FFF3C4; --line:#E7E1D6;
  --ink:#17120F; --muted:#5F5751;
  --taxi:#FFC72C; --best:#E0342A; --sea:#0B7A99; --sea-d:#07586F; --dusk:#F2507B; --mango:#FF7A1A; --leaf:#16A34A;
  --c-fix:#0B7A99; --c-rent:#FF7A1A; --c-care:#E23E6E;
  --shadow:0 2px 0 var(--ink);
  --soft:0 10px 30px rgba(23,18,15,.12);
  --display:"Baloo 2",ui-rounded,system-ui,sans-serif;
  --body:"Mukta",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--best);outline-offset:3px;border-radius:10px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg{display:block}

/* ---------- header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;height:64px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff}
.logo svg{width:38px;height:38px;flex:none}
.logo .wm{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.02em;line-height:1}
.logo .wm i{font-style:normal;color:var(--taxi)}
.logo .city{font-size:11px;font-weight:800;letter-spacing:.14em;background:var(--taxi);color:var(--ink);padding:1px 6px;border-radius:4px;margin-left:2px;align-self:flex-start;margin-top:6px}
.links{display:flex;gap:2px}
.links a{color:#D8D1C8;text-decoration:none;font-weight:700;padding:8px 12px;border-radius:999px}
.links a:hover{color:var(--ink);background:var(--taxi)}
@media (max-width:900px){.links{display:none}}
.nav-r{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:#2C2520;border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#D8D1C8;font-weight:800;padding:5px 11px;border-radius:999px;cursor:pointer;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--taxi);color:var(--ink)}
.me{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding:8px 13px;border-radius:999px;border:2px solid #4A3F37;background:transparent;color:#fff;cursor:pointer}
.me.on{border-color:var(--leaf);color:#7BE3A0}
@media (max-width:560px){.me{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2.5px solid var(--ink);border-radius:16px;padding:12px 22px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;font-size:17px}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn-taxi{background:var(--taxi);color:var(--ink)}
.btn-ink{background:var(--ink);color:#fff}
.btn-white{background:#fff;color:var(--ink)}
.btn-red{background:var(--best);color:#fff}
.btn-sea{background:var(--sea);color:#fff}
.btn-sm{padding:7px 14px;font-size:15px;border-radius:999px;box-shadow:0 3px 0 var(--ink)}

/* ---------- hero ---------- */
.hero{background:linear-gradient(180deg,#FFB547 0%,#FF8A5C 38%,#F2507B 72%,#C23C7E 100%);color:var(--ink);position:relative;overflow:hidden}
.hero-txt{padding-block:40px 8px;position:relative;z-index:2;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:end}
@media (max-width:900px){.hero-txt{grid-template-columns:1fr}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;background:var(--ink);color:var(--taxi);padding:5px 14px 5px 8px;border-radius:999px}
.eyebrow .dot{width:10px;height:10px;border-radius:50%;background:#7BE3A0;animation:pulse 1.8s infinite}
.hero h1{font-size:clamp(40px,7vw,80px);font-weight:800;margin:16px 0 10px;letter-spacing:-.02em;color:var(--ink)}
.hero h1 mark{background:none;color:#fff;-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--ink);padding:0}
.hero p.lede{font-size:clamp(18px,2vw,21px);font-weight:600;max-width:46ch;margin:0 0 22px;color:#2B1712}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.cta{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 18px 12px 12px}
.cta .ci{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:#fff;border:2px solid var(--ink)}
.cta .ci svg{width:34px;height:34px}
.cta b{display:block;font-size:19px;line-height:1.1}
.cta small{display:block;font-weight:600;font-size:14px;opacity:.8}
.trustrow{display:flex;flex-wrap:wrap;gap:10px}
.tchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);border:2px solid var(--ink);border-radius:999px;padding:5px 14px 5px 6px;font-weight:800;font-size:15px}
.tchip span.i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--taxi)}
.tchip svg{width:16px;height:16px}
.scene{width:100%;height:clamp(230px,34vw,420px);margin-top:-10px;position:relative;z-index:1}
.scene svg{width:100%;height:100%}

/* scene animation */
.wave{animation:wave 6s linear infinite}
.wave.w2{animation-duration:9s;animation-direction:reverse}
.taxi{animation:drive 13s linear infinite}
.bus{animation:driveBack 21s linear infinite}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 3.6s ease-in-out infinite}
.bob.b2{animation-delay:-1.2s}.bob.b3{animation-delay:-2.4s}
.lamp{animation:twinkle 2.4s ease-in-out infinite}
.win{animation:twinkle 3.2s ease-in-out infinite}
.birds{animation:fly 26s linear infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}

/* ticker */
.ticker{background:var(--taxi);border-block:3px solid var(--ink);overflow:hidden}
.tk{display:flex;gap:34px;width:max-content;padding-block:10px;animation:mq 40s linear infinite}
.tk span{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap}
.tk svg{width:30px;height:30px}

/* ---------- sections ---------- */
section.band{padding-block:64px}
.bg-mist{background:var(--mist)}
.bg-lemon{background:var(--lemon)}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--taxi);padding:3px 12px;border-radius:6px}
.sec-title{font-size:clamp(32px,4.6vw,52px);font-weight:800;margin:12px 0 8px;letter-spacing:-.015em}
.sec-sub{color:var(--muted);max-width:60ch;margin:0 0 28px;font-size:18px;font-weight:500}
.stephead{display:flex;align-items:center;gap:12px;margin:34px 0 14px}
.stephead .n{width:40px;height:40px;border-radius:50%;background:var(--taxi);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;flex:none}
.stephead h3{font-size:26px}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:820px){.cats{grid-template-columns:1fr}}
.cat{text-align:left;border:3px solid var(--ink);background:#fff;border-radius:26px;padding:0;cursor:pointer;overflow:hidden;box-shadow:0 6px 0 var(--ink);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.cat:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 10px 0 var(--ink)}
.cat .art{background:var(--cbg);height:170px;display:grid;place-items:center;border-bottom:3px solid var(--ink);position:relative;overflow:hidden}
.cat .art svg{width:240px;height:160px;max-width:100%}
.cat .art::after{content:"";position:absolute;inset:auto -30px -60px auto;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.25)}
.cat .body{padding:16px 20px 18px;display:flex;align-items:center;gap:12px}
.cat .body h3{font-size:28px}
.cat .body p{margin:0;color:var(--muted);font-size:15px;font-weight:600;line-height:1.3}
.cat .arrow{margin-left:auto;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;flex:none;background:#fff;transition:transform .2s,background .2s}
.cat:hover .arrow{transform:translateX(4px)}
.cat[aria-pressed="true"]{box-shadow:0 0 0 5px var(--cc),0 6px 0 var(--ink)}
.cat[aria-pressed="true"] .arrow{background:var(--taxi)}
.cat[aria-pressed="true"] .arrow svg{transform:rotate(90deg)}
.arrow svg{width:22px;height:22px;transition:transform .2s}

/* type tiles */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.type{border:2.5px solid var(--ink);background:#fff;border-radius:18px;padding:12px 8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:15px;line-height:1.15;text-align:center;transition:transform .12s,background .12s;box-shadow:0 3px 0 var(--ink)}
.type:hover{transform:translateY(-3px)}
.type svg{width:54px;height:54px;transition:transform .3s}
.type:hover svg{transform:scale(1.12) rotate(-4deg)}
.type[aria-pressed="true"]{background:var(--taxi)}
.type.any svg{width:54px;height:54px}

/* stations */
.lines{display:flex;flex-direction:column;gap:18px}
.lineRow{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center}
@media (max-width:620px){.lineRow{grid-template-columns:1fr}}
.lineTag{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.lineTag i{width:18px;height:18px;border-radius:50%;background:var(--lc);border:2.5px solid var(--ink);flex:none}
.track{position:relative;overflow-x:auto;padding:4px 4px 16px}
.stations{display:flex;gap:10px;position:relative;width:max-content;padding-bottom:18px}
.stations::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:6px;border-radius:3px;background:var(--lc)}
.stn{position:relative;border:0;background:none;padding:0;cursor:pointer}
.stn .board{display:flex;flex-direction:column;align-items:center;background:var(--taxi);border:2.5px solid var(--ink);border-radius:6px;padding:3px 12px;min-width:92px;transition:transform .12s}
.stn .board b{font-family:var(--body);font-weight:800;font-size:14px;letter-spacing:.06em}
.stn .board small{font-size:13px;font-weight:700;line-height:1.1}
.stn::after{content:"";position:absolute;left:50%;bottom:-19px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--ink);z-index:1}
.stn:hover .board{transform:translateY(-3px)}
.stn[aria-pressed="true"] .board{background:var(--ink);color:var(--taxi)}
.stn[aria-pressed="true"]::after{background:var(--best);animation:pulseR 1.5s infinite}
.allRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.days{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.pchip{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 15px;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.pchip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pchip[aria-pressed="true"]{background:var(--ink);color:var(--taxi)}
.pchip svg{width:18px;height:18px}

/* results */
.resbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:36px 0 16px;padding-top:26px;border-top:3px dashed var(--ink)}
.modeTabs{display:inline-flex;background:var(--ink);border-radius:999px;padding:4px;flex-wrap:wrap}
.modeTabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;cursor:pointer;color:#D8D1C8;display:flex;gap:8px;align-items:center}
.modeTabs button svg{width:20px;height:20px}
.modeTabs button[aria-selected="true"]{background:var(--taxi);color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.res-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.res-head h2{font-size:28px}
.res-head .count{font-weight:800;background:var(--lemon);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:15px}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:860px){.list{grid-template-columns:1fr}}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:16px;display:grid;grid-template-columns:84px 1fr auto;gap:14px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .15s,box-shadow .15s;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.list>*,.postgrid>*,.info,.lineRow>*,form.post>*{min-width:0}
@media (max-width:480px){.card{grid-template-columns:62px 1fr auto;gap:10px;padding:14px}.thumb{width:62px;height:62px;border-radius:14px}.thumb svg{width:42px;height:42px}.price .amt{font-size:22px}.info h3{font-size:18px}.badges{margin-left:0}}
.thumb{width:84px;height:84px;border-radius:18px;background:var(--cbg);border:2.5px solid var(--ink);display:grid;place-items:center;position:relative}
.thumb svg{width:56px;height:56px}
.thumb .shift{position:absolute;right:-8px;bottom:-8px;width:32px;height:32px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center}
.thumb .shift svg{width:20px;height:20px}
.info h3{font-size:21px;line-height:1.1}
.meta{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:15px;font-weight:600}
.meta span{display:flex;gap:6px;align-items:center}
.meta svg{width:17px;height:17px;flex:none}
.note{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.35}
.price{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.price .amt{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.price .per{color:var(--muted);font-size:12px;font-weight:700;max-width:90px;line-height:1.2}
.pill{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;border:2px solid var(--ink);background:var(--lemon);white-space:nowrap}
.pill.low{background:var(--best);color:#fff}
.who{grid-column:1/-1;display:flex;align-items:center;gap:10px;border-top:2px dashed var(--line);padding-top:12px;flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;flex:none;border:2.5px solid var(--ink);font-size:16px}
.who .name{font-weight:800;line-height:1.1}
.stars{color:#C98A00;font-weight:800;font-size:14px}
.badges{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.b{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;border:2px solid var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:#fff}
.b svg{width:13px;height:13px}
.b.ver{background:#D8F5E3}
.b.inst{background:var(--taxi)}
.b.need{background:var(--dusk);color:#fff}
.b.pend{background:#eee;color:var(--muted);border-color:#bbb}
.empty{grid-column:1/-1;padding:36px;text-align:center;background:#fff;border-radius:22px;border:3px dashed var(--ink);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:90px;height:90px}

/* how */
.howToggle{display:inline-flex;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:4px;margin-bottom:26px}
.howToggle button{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:800;cursor:pointer}
.howToggle button[aria-selected="true"]{background:var(--ink);color:var(--taxi)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.step{background:#fff;border:2.5px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.step .art{height:170px;display:grid;place-items:center;background:var(--sbg);border-bottom:2.5px solid var(--ink);position:relative}
.step .art svg{height:140px;width:auto;max-width:90%}
.step .num{position:absolute;left:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--taxi);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px}
.step .tx{padding:16px 18px 18px}
.step h3{font-size:23px}
.step p{margin:4px 0 0;color:var(--muted);font-weight:500}

/* trust */
.shields{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:860px){.shields{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.shields{grid-template-columns:1fr}}
.sh{background:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 var(--ink)}
.sh svg{width:66px;height:66px}
.sh h3{font-size:21px}
.sh p{margin:0;color:var(--muted);font-size:15px;font-weight:500}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
@media (max-width:860px){.roles{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.roles{grid-template-columns:1fr}}
.role{background:var(--ink);color:#fff;border-radius:20px;padding:16px}
.role .rh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.role .rh span{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}
.role .rh svg{width:32px;height:32px}
.role h3{font-size:19px;color:var(--taxi)}
.role ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
.role li{display:flex;gap:8px;align-items:center}
.role li i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;flex:none;background:#7BE3A0;color:var(--ink)}
.role li.no{opacity:.45}
.role li.no i{background:#6b625b;color:#fff}

/* motivation / train */
.moti{background:var(--ink);color:#fff;overflow:hidden;position:relative}
.moti-in{padding-block:64px 20px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
@media (max-width:860px){.moti-in{grid-template-columns:1fr}}
.moti h2{font-size:clamp(34px,5.4vw,62px);font-weight:800;letter-spacing:-.015em}
.moti h2 span{color:var(--taxi)}
.moti p{color:#D8D1C8;font-size:18px;max-width:50ch;margin:14px 0 22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border:2.5px solid #4A3F37;border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center}
.stat svg{width:44px;height:44px;flex:none}
.stat .n{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.6vw,38px);line-height:1;color:var(--taxi)}
.stat span.l{display:block;color:#D8D1C8;font-size:14px;font-weight:600;line-height:1.2;margin-top:2px}
.fine{grid-column:1/-1;font-size:12px;color:#A39A92;margin:0}
.rail{position:relative;height:150px;margin-top:10px}
.rail .tracks{position:absolute;left:0;right:0;bottom:14px;height:20px;background:repeating-linear-gradient(90deg,#6b5a4c 0 8px,transparent 8px 26px);border-top:4px solid #BDB3A8;border-bottom:4px solid #BDB3A8}
.train{position:absolute;bottom:26px;left:100%;width:980px;animation:train 15s linear infinite}
.train svg{width:980px;height:118px}

/* post */
.postgrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;align-items:start}
@media (max-width:900px){.postgrid{grid-template-columns:1fr}}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.perk{display:flex;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:700;font-size:15px;line-height:1.2}
.perk svg{width:36px;height:36px;flex:none}
form.post{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 7px 0 var(--ink)}
.bigseg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigseg button{border:2.5px solid var(--ink);background:#fff;border-radius:16px;padding:10px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:17px}
.bigseg button svg{width:38px;height:38px;flex:none}
.bigseg button[aria-pressed="true"]{background:var(--taxi);box-shadow:0 3px 0 var(--ink)}
.pcats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcats button{border:2.5px solid var(--ink);background:#fff;border-radius:14px;padding:8px 4px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
.pcats button svg{width:38px;height:38px}
.pcats button[aria-pressed="true"]{background:var(--cbg)}
.ptypes{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.ptypes button{flex:none;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 10px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px}
.ptypes button svg{width:28px;height:28px}
.ptypes button[aria-pressed="true"]{background:var(--taxi)}
.lbl{font-size:14px;font-weight:800;margin-bottom:-8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.fl{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:800}
.fl input,.fl select{border:2.5px solid var(--ink);background:#fff;border-radius:12px;padding:10px 12px;font-size:17px;font-weight:600;color:var(--ink);width:100%}
.fl input:focus,.fl select:focus{outline:none;box-shadow:0 0 0 4px var(--taxi)}

footer{background:var(--ink);color:#D8D1C8;font-size:15px;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
@media (min-width:821px){footer{padding-bottom:0}}
footer .skyline{height:70px;width:100%;display:block;background:var(--paper)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding-block:26px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);display:none;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);border-top:3px solid var(--taxi)}
@media (max-width:820px){.bnav{display:grid}}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 9px;font-size:13px;font-weight:800;color:#D8D1C8;text-decoration:none;background:none;border:0;cursor:pointer}
.bnav svg{width:24px;height:24px}
.bnav .pb{width:48px;height:48px;border-radius:16px;background:var(--taxi);color:var(--ink);display:grid;place-items:center;margin-top:-24px;border:3px solid var(--ink)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(23,18,15,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border:3px solid var(--ink);border-radius:26px;max-width:480px;width:100%;padding:22px;box-shadow:0 8px 0 var(--ink);max-height:90vh;overflow:auto;animation:pop .3s cubic-bezier(.2,.9,.3,1.25)}
.mhead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.mhead .thumb{width:64px;height:64px;border-radius:16px}
.mhead .thumb svg{width:44px;height:44px}
.modal h3{font-size:24px}
.modal form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:2px dashed var(--line);font-weight:600}
.row span:first-child{color:var(--muted)}
.row.tot{font-weight:800;font-size:19px;border-bottom:0}
.row.tot span:first-child{color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.vsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.vsteps div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.vsteps div span{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;background:#fff;transition:background .3s}
.vsteps div span svg{width:24px;height:24px}
.vsteps div.on{color:var(--ink)}
.vsteps div.on span{background:var(--taxi)}
.vsteps div.done span{background:#7BE3A0}
.mnote{font-size:14px;color:var(--muted);margin:8px 0 0}
.done{display:grid;place-items:center;text-align:center;padding:6px 0}
.done svg{width:110px;height:110px}
.done .ck{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .5s .25s ease forwards}
.done .cc{stroke-dasharray:260;stroke-dashoffset:260;animation:draw .5s ease forwards}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--taxi);padding:12px 20px;border-radius:999px;font-weight:800;z-index:60;max-width:calc(100% - 32px);text-align:center;border:2.5px solid var(--taxi)}
@media (min-width:821px){.toast{bottom:28px}}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(123,227,160,.7)}100%{box-shadow:0 0 0 12px rgba(123,227,160,0)}}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(224,52,42,.6)}100%{box-shadow:0 0 0 10px rgba(224,52,42,0)}}
@keyframes wave{to{transform:translateX(-120px)}}
@keyframes drive{from{transform:translateX(-160px)}to{transform:translateX(1360px)}}
@keyframes driveBack{from{transform:translateX(1360px)}to{transform:translateX(-260px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes fly{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes train{from{left:100%}to{left:-1000px}}
@keyframes rise{from{transform:translateY(14px) scale(.98)}}
@keyframes pop{from{transform:translateY(16px) scale(.94)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.train{left:10%}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap nav">
    <a class="logo" href="#top" aria-label="Fixate Mumbai home">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="12" fill="#FFC72C"/>
        <circle cx="15" cy="20" r="7.5" fill="none" stroke="#17120F" stroke-width="3.4"/>
        <circle cx="25" cy="20" r="7.5" fill="none" stroke="#E0342A" stroke-width="3.4"/>
        <path d="M16.4 20.3l2.5 2.5 4.8-5" fill="none" stroke="#17120F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wm">Fix<i>ate</i></span><span class="city">MUMBAI</span>
    </a>
    <nav class="links" aria-label="Main">
      <a href="#find" data-t="nav_find"></a><a href="#how" data-t="nav_how"></a><a href="#trust" data-t="nav_safe"></a><a href="#post" data-t="nav_earn"></a>
    </nav>
    <div class="nav-r">
      <div class="lang" role="group" aria-label="Language"><button type="button" id="lEn" aria-pressed="true">EN</button><button type="button" id="lHi" aria-pressed="false">हिं</button></div>
      <button class="me" id="meBtn" type="button"></button>
    </div>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="wrap hero-txt">
      <div>
        <span class="eyebrow"><span class="dot"></span><span data-t="hero_eye"></span></span>
        <h1 data-t="hero_h"></h1>
        <p class="lede" data-t="hero_p"></p>
        <div class="ctas">
          <a class="btn btn-taxi cta" href="#find"><span class="ci" data-icon="attendant"></span><span><b data-t="cta_need"></b><small data-t="cta_need_s"></small></span></a>
          <a class="btn btn-white cta" href="#post"><span class="ci" data-icon="rupee"></span><span><b data-t="cta_earn"></b><small data-t="cta_earn_s"></small></span></a>
        </div>
      </div>
      <div class="trustrow">
        <span class="tchip"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></span><span data-t="t1"></span></span>
        <span class="tchip"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M7 5h10M7 9h10M7 5c6 0 6 8 0 8l8 7"/></svg></span><span data-t="t2"></span></span>
        <span class="tchip"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></span><span data-t="t3"></span></span>
      </div>
    </div>

        </defs>
        <circle cx="820" cy="262" r="120" fill="#FFE08A" opacity=".9"/>
        <circle cx="820" cy="262" r="160" fill="#FFE08A" opacity=".25"/>
        <g class="birds"><path d="M200 70l10 7 10-7M232 56l8 6 8-6M250 84l7 5 7-5" fill="none" stroke="#5A2440" stroke-width="3" stroke-linecap="round"/></g>
        <g id="farB" fill="#8E3F74" opacity=".75"></g>
        <g id="nearB" fill="#3A1F4D"></g>
        <!-- Gateway of India -->
        <g fill="#2A1438">
          <rect x="70" y="196" width="190" height="96"/>
          <rect x="62" y="186" width="206" height="12" rx="2"/>
          <rect x="74" y="160" width="22" height="28"/><circle cx="85" cy="158" r="12"/>
          <rect x="116" y="170" width="18" height="18"/><circle cx="125" cy="168" r="9"/>
          <rect x="196" y="170" width="18" height="18"/><circle cx="205" cy="168" r="9"/>
          <rect x="234" y="160" width="22" height="28"/><circle cx="245" cy="158" r="12"/>
          <rect x="150" y="150" width="30" height="38"/><circle cx="165" cy="146" r="16"/>
        </g>
        <path d="M143 292V236a22 22 0 0 1 44 0v56z" fill="#FF8A5C"/>
        <path d="M90 292v-40a10 10 0 0 1 20 0v40zM220 292v-40a10 10 0 0 1 20 0v40z" fill="#E86A6A"/>
        <!-- Clock tower -->
        <g fill="#2A1438"><rect x="300" y="120" width="26" height="172"/><path d="M296 122l17-34 17 34z"/></g>
        <circle cx="313" cy="146" r="7" fill="#FFE08A"/>
        <!-- Sea -->
        <rect x="0" y="290" width="1200" height="82" fill="url(#seaG)"/>
        <g fill="#FFD27A" opacity=".7"><rect x="760" y="300" width="120" height="4" rx="2"/><rect x="780" y="312" width="80" height="4" rx="2"/><rect x="796" y="324" width="48" height="4" rx="2"/></g>
        <g class="wave"><path d="M0 338q30-10 60 0t60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0" fill="none" stroke="#7FD3E8" stroke-width="3" opacity=".6"/></g>
        <g class="wave w2"><path d="M0 356q30-8 60 0t60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0" fill="none" stroke="#BFEAF5" stroke-width="2.5" opacity=".5"/></g>
        <!-- Sea Link -->
        <g stroke="#2A1438" stroke-width="2" id="cables"></g>
        <path d="M940 306L958 150 976 306M1090 306L1108 150 1126 306" fill="none" stroke="#2A1438" stroke-width="9" stroke-linejoin="round"/>
        <rect x="820" y="302" width="380" height="9" fill="#2A1438"/>
        <!-- floating help bubbles -->
        <g class="bob"><circle cx="470" cy="118" r="34" fill="#fff" stroke="#17120F" stroke-width="3"/><g transform="translate(448 96) scale(.69)" id="bub1"></g><circle cx="496" cy="94" r="11" fill="#16A34A" stroke="#17120F" stroke-width="2.5"/><path d="M491 94l4 4 6-7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="bob b2"><circle cx="650" cy="80" r="34" fill="#fff" stroke="#17120F" stroke-width="3"/><g transform="translate(628 58) scale(.69)" id="bub2"></g><circle cx="676" cy="56" r="11" fill="#16A34A" stroke="#17120F" stroke-width="2.5"/><path d="M671 56l4 4 6-7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="bob b3"><circle cx="1030" cy="100" r="34" fill="#fff" stroke="#17120F" stroke-width="3"/><g transform="translate(1008 78) scale(.69)" id="bub3"></g><circle cx="1056" cy="76" r="11" fill="#16A34A" stroke="#17120F" stroke-width="2.5"/><path d="M1051 76l4 4 6-7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>

        <rect x="0" y="370" width="1200" height="12" fill="#E9DCCB"/>
        <g id="lamps"></g>
        <rect x="0" y="382" width="1200" height="38" fill="#2B2626"/>
        <path d="M0 401h1200" stroke="#FFC72C" stroke-width="3" stroke-dasharray="26 22"/>

        <g class="bus">
          <rect x="0" y="330" width="150" height="46" rx="8" fill="#E0342A" stroke="#17120F" stroke-width="3"/>

          <g fill="#BFE6F2" stroke="#17120F" stroke-width="2"><rect x="10" y="334" width="22" height="9" rx="2"/><rect x="38" y="334" width="22" height="9" rx="2"/><rect x="66" y="334" width="22" height="9" rx="2"/><rect x="94" y="334" width="22" height="9" rx="2"/><rect x="122" y="334" width="20" height="9" rx="2"/></g>
          <circle cx="30" cy="378" r="9" fill="#17120F"/><circle cx="120" cy="378" r="9" fill="#17120F"/>
        </g>

          <path d="M18 352l14-16h44l14 16z" fill="#FFC72C" stroke="#17120F" stroke-width="3" stroke-linejoin="round"/>
          <path d="M36 350l8-10h12v10zM62 350v-10h12l8 10z" fill="#9FD3E6"/>

          <rect x="40" y="328" width="28" height="9" rx="2" fill="#FFC72C" stroke="#17120F" stroke-width="2"/>

  <div class="ticker" aria-hidden="true"><div class="tk" id="tk"></div></div>

  <!-- FINDER -->
  <section class="band" id="find">
    <div class="wrap">
      <span class="kicker" data-t="find_k"></span>
      <h2 class="sec-title" data-t="find_h"></h2>

      <div class="stephead"><span class="n">1</span><h3 data-t="s1"></h3></div>
      <div class="cats" id="cats" role="group"></div>

      <div class="stephead"><span class="n">2</span><h3 data-t="s2"></h3></div>
      <div class="types" id="types" role="group"></div>

      <div class="stephead"><span class="n">3</span><h3 data-t="s3"></h3></div>
      <div class="lines" id="lines"></div>
      <div class="days" id="days" role="group"></div>

      <div class="resbar" id="results">
        <div class="modeTabs" role="tablist">
          <button role="tab" id="mOffers" aria-selected="true" type="button"><span data-icon-s="hand"></span><span data-t="avail"></span></button>
          <button role="tab" id="mNeeds" aria-selected="false" type="button"><span data-icon-s="sos"></span><span data-t="asking"></span></button>
        </div>
        <div class="tools" id="tools"></div>
      </div>
      <div class="res-head"><h2 id="resTitle"></h2><span class="count" id="resCount"></span></div>
      <div class="list" id="list"></div>
    </div>
  </section>

  <!-- HOW -->
  <section class="band bg-lemon" id="how">
    <div class="wrap">
      <span class="kicker" data-t="how_k"></span>
      <h2 class="sec-title" data-t="how_h"></h2>
      <p class="sec-sub" data-t="how_p"></p>
      <div class="howToggle" role="tablist">
        <button role="tab" id="hNeed" aria-selected="true" type="button" data-t="h_need"></button>
        <button role="tab" id="hEarn" aria-selected="false" type="button" data-t="h_earn"></button>
      </div>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <!-- TRUST -->
  <section class="band" id="trust">
    <div class="wrap">
      <span class="kicker" data-t="safe_k"></span>
      <h2 class="sec-title" data-t="safe_h"></h2>
      <p class="sec-sub" data-t="safe_p"></p>
      <div class="shields" id="shields"></div>
      <div class="roles" id="roles"></div>
    </div>
  </section>

  <!-- MOTIVATION -->
  <section class="moti">
    <div class="wrap moti-in">
      <div>
        <span class="kicker" style="background:var(--taxi);color:var(--ink)" data-t="moti_k"></span>

        <p data-t="moti_p"></p>
        <a class="btn btn-taxi" href="#post" data-t="moti_cta"></a>
      </div>

    </div>
    <div class="rail" aria-hidden="true">
      <div class="tracks"></div>
      <div class="train"><svg viewBox="0 0 980 118" id="trainSvg"></svg></div>
    </div>

  <!-- POST -->
  <section class="band bg-mist" id="post">
    <div class="wrap postgrid">
      <div>
        <span class="kicker" data-t="post_k"></span>
        <h2 class="sec-title" data-t="post_h"></h2>

          <button type="button" id="pNeed" aria-pressed="false"><span data-icon="sosBig"></span><span data-t="needing"></span></button>
        </div>

        <div class="pcats" id="pCats"></div>
        <div class="lbl" data-t="p_type"></div>
        <div class="ptypes" id="pTypes"></div>
        <label class="fl" for="pTitle"><span data-t="p_desc"></span><input id="pTitle" required></label>
        <div class="grid2">
          <label class="fl" for="pArea"><span data-t="p_area"></span><select id="pArea"></select></label>
          <label class="fl" for="pDay"><span data-t="p_day"></span><select id="pDay"></select></label>
        </div>
        <label class="fl" for="pPrice"><span id="pPriceLbl"></span><input id="pPrice" type="number" min="50" required></label>
        <button class="btn btn-red" type="submit" id="pSubmit"></button>
      </form>
    </div>
  </section>
</main>

<footer>
  <svg class="skyline" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true"><path id="ftSky" fill="#17120F"/></svg>
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Fixate Mumbai home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#FFC72C"/><circle cx="15" cy="20" r="7.5" fill="none" stroke="#17120F" stroke-width="3.4"/><circle cx="25" cy="20" r="7.5" fill="none" stroke="#E0342A" stroke-width="3.4"/><path d="M16.4 20.3l2.5 2.5 4.8-5" fill="none" stroke="#17120F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="wm">Fix<i>ate</i></span><span class="city">MUMBAI</span>
    </a>
    <span data-t="foot1"></span>
    <span data-t="foot2"></span>
  </div>
</footer>

<nav class="bnav" aria-label="Quick menu">
  <a href="#top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="b_home"></span></a>

    <div class="actions"><button class="btn btn-white" id="xC" type="button">${tr("cancel")}</button><button class="btn btn-taxi" id="xOk" type="button">${s.inst?"⚡ "+tr("book"):tr("request")}</button></div>`);
  const calc=()=>{const n=s.cat==="fix"?1:Math.max(1,+($("xN").value||1));if($("xU"))$("xU").textContent=n;const sub=s.price*n,f=Math.round(sub*.05);
    $("xSub").textContent="₹"+sub.toLocaleString("en-IN");$("xFee").textContent="₹"+f.toLocaleString("en-IN");$("xTot").textContent="₹"+(sub+f+(s.deposit||0)).toLocaleString("en-IN");};
  calc();if($("xN"))$("xN").oninput=calc;
  let pick=s.a;$("modal").querySelectorAll("#pick .pchip").forEach(b=>b.onclick=()=>{pick=b.textContent;$("modal").querySelectorAll("#pick .pchip").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("xC").onclick=close;
  $("xOk").onclick=()=>needVerify(()=>{if(s.left!==undefined)s.left--;render();
    s.inst?success(en?"Booking confirmed!":"बुकिंग पक्की!",en?`${s.name}${s.cat==="fix"?" arrives "+dayLabel(s.day).toLowerCase()+" at "+pick:""}. Contact details are now shared with both of you.`:`${s.name}${s.cat==="fix"?" "+dayLabel(s.day)+" "+pick+" बजे आएंगे":""}। अब दोनों को एक-दूसरे का नंबर दिखेगा।`)
      :success(en?"Request sent!":"रिक्वेस्ट भेज दी!",en?`${s.name} usually replies within the hour.`:`${s.name} आमतौर पर एक घंटे में जवाब देते हैं।`);});
}

/* ================= POST ================= */
function setPost(){
  const P=state.post,c=CATS[P.cat],need=P.kind==="need";
  $("pOffer").setAttribute("aria-pressed",!need);$("pNeed").setAttribute("aria-pressed",need);
  $("pCats").innerHTML=Object.entries(CATS).map(([k,cc])=>`<button type="button" data-k="${k}" aria-pressed="${P.cat===k}" style="--cbg:${cc.bg}">${svg(Object.keys(cc.types)[0])}${L(cc.name)}</button>`).join("");
  $("pCats").querySelectorAll("button").forEach(b=>b.onclick=()=>{P.cat=b.dataset.k;P.type=Object.keys(CATS[P.cat].types)[0];setPost();$("pPrice").value=P.cat==="care"?1000:P.cat==="rent"?200:399;});
  if(!c.types[P.type])P.type=Object.keys(c.types)[0];
  $("pTypes").innerHTML=Object.entries(c.types).map(([k,n])=>`<button type="button" data-k="${k}" aria-pressed="${P.type===k}">${svg(k)}${L(n)}</button>`).join("");
  $("pTypes").querySelectorAll("button").forEach(b=>b.onclick=()=>{P.type=b.dataset.k;setPost();});
  $("pTitle").placeholder=need?(lang==="en"?"e.g. Need a night attendant at KEM, 3 nights":"जैसे: KEM में 3 रात के लिए अटेंडेंट चाहिए"):(lang==="en"?"e.g. 7 yrs experience, Marathi & Hindi":"जैसे: 7 साल का अनुभव, मराठी और हिंदी");
  $("pPriceLbl").textContent=(need?tr("p_budget"):tr("p_price"))+" (₹ "+L(c.unit)+")";
  $("pSubmit").textContent=need?tr("pub_need"):tr("pub_offer");
  if(!$("pPrice").value)$("pPrice").value=399;
}
$("pOffer").onclick=()=>{state.post.kind="offer";setPost();};$("pNeed").onclick=()=>{state.post.kind="need";setPost();};
$("postForm").addEventListener("submit",e=>{e.preventDefault();needVerify(()=>{
  const P=state.post,need=P.kind==="need",d=+$("pDay").value,en=lang==="en",note=$("pTitle").value.trim();
  const s={cat:P.cat,kind:P.kind,type:P.type,name:en?"You":"आप",area:$("pArea").value,day:d,price:+$("pPrice").value,rating:5,count:0,ver:true,inst:!need,note:[note,note],applicants:0};
  if(P.cat==="rent"){s.dur=7;if(!need)s.deposit=s.price*10;}else{s.a=P.cat==="care"?"08:00":"10:00";s.b=P.cat==="care"?"20:00":"13:00";}
  if(P.cat==="fix"&&!need)s.left=2;
  items.push(s);
  Object.assign(state,{cat:P.cat,type:"",area:"",day:"",mode:P.kind});
  $("mOffers").setAttribute("aria-selected",!need);$("mNeeds").setAttribute("aria-selected",need);
  renderCats();renderTypes();renderLines();renderDays();render();$("pTitle").value="";
  success(need?(en?"Your need is posted!":"आपकी ज़रूरत पोस्ट हो गई!"):(en?"Your offer is live!":"आपका ऑफ़र लाइव है!"),need?(en?"Verified providers nearby can now apply.":"आस-पास के वेरिफ़ाइड प्रोवाइडर अब अप्लाई कर सकते हैं।"):(en?"People searching near you can now book you.":"आपके इलाके में ढूंढने वाले अब आपको बुक कर सकते हैं।"),()=>$("results").scrollIntoView({behavior:"smooth"}));
});});

/* ================= WIRING ================= */
function setMode(m){state.mode=m;$("mOffers").setAttribute("aria-selected",m==="offer");$("mNeeds").setAttribute("aria-selected",m==="need");render();}
$("mOffers").onclick=()=>setMode("offer");$("mNeeds").onclick=()=>setMode("need");
$("hNeed").onclick=()=>{state.how="need";renderSteps();};$("hEarn").onclick=()=>{state.how="earn";renderSteps();};
$("lEn").onclick=()=>{lang="en";applyLang();};$("lHi").onclick=()=>{lang="hi";applyLang();};

/* count-up once when stats scroll into view (final values are shown at rest) */
function countUp(){document.querySelectorAll("#stats .n").forEach(el=>{
  const to=+el.dataset.to,dec=+el.dataset.dec,pre=el.dataset.pre,suf=el.dataset.suf,t0=performance.now();
  const f=v=>pre+(dec?v.toFixed(dec):Math.round(v).toLocaleString("en-IN"))+suf;
  const tick=t=>{const p=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(tick);};requestAnimationFrame(tick);});}
applyLang();
if(!reduce&&"IntersectionObserver" in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){countUp();io.disconnect();}},{threshold:.4});io.observe($("stats"));}
</script>
